<!-- 自定义确认弹窗 -->
<style>
.confirm-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
.confirm-overlay.show {
  display: flex;
}
.confirm-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 24px 20px;
  max-width: 320px;
  width: 90%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  animation: popIn 0.15s ease-out;
}
@keyframes popIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.confirm-box p {
  margin: 0 0 20px;
  font-size: 15px;
  line-height: 1.6;
  color: #333;
  white-space: pre-line;
}
.confirm-box .confirm-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.confirm-box button {
  padding: 10px 24px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.confirm-box .confirm-cancel {
  background: #f0f0f0;
  color: #666;
}
.confirm-box .confirm-cancel:hover {
  background: #e0e0e0;
}
.confirm-box .confirm-ok {
  background: #e74c3c;
  color: #fff;
}
.confirm-box .confirm-ok:hover {
  background: #c0392b;
}
</style>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-text"></p>
    <div class="confirm-buttons">
      <button class="confirm-cancel" id="confirm-cancel">取消</button>
      <button class="confirm-ok" id="confirm-ok">删除</button>
    </div>
  </div>
</div>
