<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小闪光 Soft Light</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: linear-gradient(180deg, #fff8f0 0%, #fef3e2 100%);
      min-height: 100vh;
      color: #5a4a3a;
    }

    header {
      text-align: center;
      padding: 24px 16px 12px;
    }

    header h1 {
      font-size: 24px;
      color: #e8967a;
      font-weight: 600;
    }

    header p {
      font-size: 14px;
      color: #b8a494;
      margin-top: 4px;
    }

    /* Tab 导航 */
    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      background: rgba(255, 248, 240, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .tab {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: #f0e0d0;
      color: #8a7a6a;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: #e8967a;
      color: #fff;
    }

    /* 页面容器 */
    .page {
      display: none;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .page.active {
      display: block;
    }

    /* 表单 */
    #record-form {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    #text-input {
      width: 100%;
      min-height: 80px;
      border: 1px solid #f0e0d0;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    #text-input:focus {
      border-color: #e8967a;
    }

    #image-input {
      margin-top: 10px;
      font-size: 13px;
      color: #8a7a6a;
    }

    #record-form button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #e8967a;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #record-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 记录列表 */
    .record-item {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .record-text {
      font-size: 15px;
      line-height: 1.6;
      color: #5a4a3a;
    }

    .record-reply {
      margin-top: 6px;
      font-size: 14px;
    }

    .record-date {
      margin-top: 4px;
    }

    /* 删除按钮 */
    .delete-btn {
      margin-top: 8px;
      padding: 4px 10px;
      border: none;
      border-radius: 8px;
      background: #f6f1ea;
      color: #b8a494;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #fde8e4;
      color: #e74c3c;
    }

    .album-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      margin: 0;
      width: 24px;
      height: 24px;
      line-height: 1;
      padding: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .album-item:hover .album-delete {
      opacity: 1;
    }

    /* 相册 */
    #album-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      padding: 8px 0;
    }

    /* 小结 */
    #summary-content {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      font-size: 16px;
    }

    #summary-content p {
      padding: 6px 0;
    }

    /* 空状态 */
    .empty-hint {
      text-align: center;
      color: #b8a494;
      padding: 40px 20px;
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #c8b8a8;
    }

    /* 自定义确认弹窗 */
    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .confirm-overlay.show {
      display: flex;
    }

    .confirm-box {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px 20px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: popIn 0.15s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .confirm-box p {
      margin: 0 0 20px;
      font-size: 15px;
      line-height: 1.6;
      color: #333;
      white-space: pre-line;
    }

    .confirm-box .confirm-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .confirm-box button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .confirm-box .confirm-cancel {
      background: #f0f0f0;
      color: #666;
    }

    .confirm-box .confirm-cancel:hover {
      background: #e0e0e0;
    }

    .confirm-box .confirm-ok {
      background: #e74c3c;
      color: #fff;
    }

    .confirm-box .confirm-ok:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 小闪光</h1>
    <p>记录普通人日常的小闪光点</p>
  </header>

  <nav>
    <button id="tab-records" class="tab active">记录</button>
    <button id="tab-album" class="tab">相册</button>
    <button id="tab-summary" class="tab">小结</button>
  </nav>

  <!-- 记录页 -->
  <div id="page-records" class="page active">
    <form id="record-form">
      <textarea id="text-input" placeholder="今天有什么小闪光？写下它..." required></textarea>
      <input type="file" id="image-input" accept="image/*">
      <button type="submit">保存闪光 ✨</button>
    </form>
    <div id="records-container">
      <p class="empty-hint">加载中...</p>
    </div>
  </div>

  <!-- 相册页 -->
  <div id="page-album" class="page">
    <div id="album-container">
      <p class="empty-hint">加载中...</p>
    </div>
  </div>

  <!-- 小结页 -->
  <div id="page-summary" class="page">
    <div id="summary-content">
      <p class="empty-hint">加载中...</p>
    </div>
  </div>

  <footer>
    小闪光 · Soft Light · 今天也值得被看见
  </footer>

  <!-- 自定义确认弹窗 -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-buttons">
        <button type="button" class="confirm-cancel" id="confirm-cancel">取消</button>
        <button type="button" class="confirm-ok" id="confirm-ok">删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
